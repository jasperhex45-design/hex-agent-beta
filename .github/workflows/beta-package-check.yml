name: HEX Beta package checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  install-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Build and extract the source package
        shell: python
        run: |
          import json, os, subprocess, sys, zipfile
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP']) / 'hex-beta-package'
          result = json.loads(subprocess.check_output([
              sys.executable, 'scripts/release_local.py', '--output-dir', str(out),
              '--source-commit', os.environ['GITHUB_SHA']], text=True))
          with zipfile.ZipFile(result['zip']) as archive:
              archive.extractall(out / 'unpacked')
          root = next((out / 'unpacked').iterdir())
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('HEX_BETA_PACKAGE_ROOT=' + str(root) + '\n')
      - name: Install the Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ${{ env.HEX_BETA_PACKAGE_ROOT }}
        run: .\scripts\bootstrap.ps1
      - name: Install the POSIX package (Linux/macOS)
        if: runner.os != 'Windows'
        working-directory: ${{ env.HEX_BETA_PACKAGE_ROOT }}
        run: sh scripts/bootstrap.sh
      - name: Verify installed package, demo and host integration plan
        shell: python
        run: |
          import json, os, platform, subprocess, zipfile
          from pathlib import Path
          root = Path(os.environ['HEX_BETA_PACKAGE_ROOT'])
          python = root / ('.venv/Scripts/python.exe' if os.name == 'nt' else '.venv/bin/python')
          def run(*args):
              subprocess.run([str(python), *args], cwd=root, check=True)
          run('scripts/verify_package.py')
          run('-c', 'import importlib.util; from pathlib import Path; from liu_agent.io import ROOT; import liu_agent.feedback_card, liu_agent.user_feedback_context; assert ROOT == Path.cwd(); assert importlib.util.find_spec("pytest") is None')
          run('-m', 'hex_agent', 'learning', '--help')
          run('scripts/hex_entry.py', 'learning', '--help')
          run('-m', 'hex_agent', 'demo', '--out', 'outputs/beta-smoke')
          run('scripts/hex_entry.py', 'codex', 'install', '--dry-run', '--codex-dir', 'outputs/beta-smoke/codex', '--skills-dir', 'outputs/beta-smoke/skills')
          # Check the same portable Skill on each OS; no host account or image call.
          out = Path(os.environ['RUNNER_TEMP']) / 'hex-portable-skill'
          built = json.loads(subprocess.check_output([
              str(python), 'scripts/build_skill_package.py', '--output-dir', str(out),
              '--source-commit', os.environ['GITHUB_SHA']], cwd=root, text=True))
          with zipfile.ZipFile(built['zip']) as archive:
              archive.extractall(out / 'unpacked')
          skill = out / 'unpacked' / 'hex'
          report = json.loads(subprocess.check_output([
              str(python), str(skill / 'scripts/hex.py'), '--skill-doctor'], cwd=out, text=True))
          assert report['ready'] and report['source_commit'] == os.environ['GITHUB_SHA']
          assert Path(report['runtime_root']).resolve() == (skill / 'runtime').resolve()
          assert report['generation_calls'] == 0 and report['network_used'] is False
          print(json.dumps({'system': platform.system(), 'architecture': platform.machine(),
                            'portable_skill_ready': report['ready'], 'version': report['version']}))
